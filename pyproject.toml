[project]
name = "tdnet"
dynamic = ["version"]
description = "TDnet 適時開示情報の Python ライブラリ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "xbrl-core>=0.1.2",
    "lxml>=5.0",
    "pandas>=2.0",
    "platformdirs>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/tdnet/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tdnet"]

[tool.pytest.ini_options]
markers = ["e2e: end-to-end tests requiring network access"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
]
